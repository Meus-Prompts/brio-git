# Variante egui do brio-git (branch `egui`). Todo push na branch é uma release:
# a versão vem dos Conventional Commits desde a última tag egui-vX.Y.Z
# (scripts/next-version.sh), Linux e Windows são compilados com ela e uma
# GitHub Release é publicada na tag egui-vX.Y.Z.
#
# Isolamento do brio-git em iced (branch `main`, tags vX.Y.Z): a release é
# criada com --latest=false, então /releases/latest continua apontando para o
# main, e o updater desta variante só considera tags egui-v*.
name: Release (egui)

on:
  push:
    branches: [egui]
  workflow_dispatch:

concurrency:
  group: release-egui
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Próxima versão
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico e tags
      - id: next
        run: |
          bash scripts/next-version.sh --test
          version="$(bash scripts/next-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Próxima versão: ${version:-nenhuma, nada novo desde a última tag}" >> "$GITHUB_STEP_SUMMARY"

  check:
    name: Clippy e testes
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Dependências do sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libwayland-dev libgtk-3-dev
      - run: cargo clippy --all-targets -- -D warnings
      # Os testes de UI renderizam com wgpu (lavapipe no runner).
      - name: Testes
        run: |
          sudo apt-get install -y -qq mesa-vulkan-drivers
          cargo test

  build:
    name: Build ${{ matrix.name }}
    needs: [version, check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04 # glibc 2.35: os binários rodam na maioria das distros (e no WSL)
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      BRIO_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: egui-${{ matrix.name }}
      - name: Versão no Cargo.toml
        shell: bash
        run: perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{BRIO_VERSION}"/m' Cargo.toml

      - name: Linux (AppImage e tar.gz)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libwayland-dev file
          packaging/appimage/build.sh
          mkdir -p dist
          cp "target/appimage/brio-git-egui-$BRIO_VERSION-x86_64.AppImage" dist/
          tar -C target/release -czf "dist/brio-git-egui-$BRIO_VERSION-linux-x86_64.tar.gz" brio-git

      - name: Windows (.exe)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/brio-git.exe -DestinationPath "dist/brio-git-egui-$env:BRIO_VERSION-windows-x86_64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: brio-git-egui-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publicar release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # cria a tag e a release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: brio-git-egui-*
          merge-multiple: true
          path: dist
      - name: Notas da versão
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'egui-v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          {
            echo "## O que mudou"
            echo
            git log --no-merges --format='- %s (%h)' ${previous:+"$previous..HEAD"}
            echo
            echo "## Downloads"
            echo
            echo "- **Linux**: \`.AppImage\` (dê permissão de execução) ou \`.tar.gz\` com o binário."
            echo "- **WSL (Windows)**: use o \`.tar.gz\` dentro do WSL (abre a janela via WSLg), ou o \`.exe\` no Windows abrindo \`\\\\\\\\wsl\$\\\\<distro>\\\\...\` — o git roda dentro da distro."
            echo "- **Windows**: descompacte o \`.zip\` e rode \`brio-git.exe\`. O app não é assinado: o SmartScreen pode pedir \"Mais informações > Executar assim mesmo\"."
            echo
            echo "Requer \`git\` instalado e no PATH (no WSL, o git da distro)."
          } > notes.md
      - name: Criar tag e release (sem virar a Latest do repositório)
        run: |
          gh release create "egui-v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "brio-git (egui) v$VERSION" \
            --notes-file notes.md \
            --latest=false
