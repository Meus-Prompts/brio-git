# Every push to main/master is a release: the version comes from the
# Conventional Commits since the last vX.Y.Z tag (scripts/next-version.sh),
# Linux, macOS and Windows are built with it, and a GitHub Release with the
# binaries is published under a new tag. The tag is the source of truth; the
# workflow does not commit back to the branch.
name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# One release at a time, in push order.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Próxima versão
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history and tags
      - id: next
        run: |
          bash scripts/next-version.sh --test
          version="$(bash scripts/next-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Próxima versão: ${version:-nenhuma, nada novo desde a última tag}" >> "$GITHUB_STEP_SUMMARY"

  check:
    name: Clippy e testes
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Dependências do sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libwayland-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: Build ${{ matrix.name }}
    needs: [version, check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04 # glibc 2.35: the binaries run on most current distros
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      BRIO_VERSION: ${{ needs.version.outputs.version }}
      BRIO_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Versão no Cargo.toml
        shell: bash
        run: perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{BRIO_VERSION}"/m' Cargo.toml

      - name: Linux (AppImage e tar.gz)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libwayland-dev file
          packaging/appimage/build.sh
          mkdir -p dist
          cp "target/appimage/brio-git-$BRIO_VERSION-x86_64.AppImage" dist/
          tar -C target/release -czf "dist/brio-git-$BRIO_VERSION-linux-x86_64.tar.gz" brio-git

      - name: macOS (.app universal)
        if: matrix.name == 'macos'
        run: |
          brew install librsvg
          packaging/macos/bundle.sh
          mkdir -p dist
          cp "target/macos/brio-git-$BRIO_VERSION-macos-universal.zip" dist/

      - name: Windows (.exe)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          cargo build --release -p brio-git
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/brio-git.exe -DestinationPath "dist/brio-git-$env:BRIO_VERSION-windows-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: brio-git-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publicar release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: brio-git-*
          merge-multiple: true
          path: dist
      - name: Notas da versão
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          {
            echo "## O que mudou"
            echo
            git log --no-merges --format='- %s (%h)' ${previous:+"$previous..HEAD"}
            echo
            echo "## Downloads"
            echo
            echo "- **Linux**: \`.AppImage\` (dê permissão de execução) ou \`.tar.gz\` com o binário"
            echo "- **macOS** (Apple Silicon e Intel): descompacte o \`.zip\` e mova \`brio-git.app\` para Aplicativos. O app não é assinado: na primeira vez, clique com o botão direito > Abrir."
            echo "- **Windows**: descompacte o \`.zip\` e rode \`brio-git.exe\`. O app não é assinado: o SmartScreen pode pedir \"Mais informações > Executar assim mesmo\"."
            echo
            echo "Requer \`git\` instalado e no PATH."
          } > notes.md
      - name: Criar tag e release
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "brio-git v$VERSION" \
            --notes-file notes.md
