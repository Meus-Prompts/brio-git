[package]
name = "brio-git"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
brio-core.workspace = true
brio-ops.workspace = true
brio-session.workspace = true
iced.workspace = true
tokio.workspace = true
futures.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "wayland", "tokio"] }
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
ureq = "3"
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
tempfile.workspace = true
