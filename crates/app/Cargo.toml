[package]
name = "lazy-git"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lazygit-core.workspace = true
lazygit-ops.workspace = true
lazygit-session.workspace = true
iced.workspace = true
tokio.workspace = true
futures.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "wayland", "tokio"] }
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
ureq = "3"
sha2 = "0.11"

[dev-dependencies]
tempfile.workspace = true
